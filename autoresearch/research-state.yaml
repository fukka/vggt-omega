      forward (no training) already move the radial bias field?
    status: refuted   # Probe A 2026-08-19: equisolid remap degrades EVERY zone (+16..+31%) at equal tokens — radial failure is not sampling density; efficiency parity dead a fortiori. Part of the input-surgery-hurts pattern (H3/Center-PH/H8 vs feature/loss-side fixes).
    motivation: "Efficiency-headline candidate; complements H6 (fewer tokens) and attacks K2's gradient at its cause."
    parent: null
    priority: closed
