hypotheses:
  - id: H5
    statement: >
      Rim-targeted, pose-preserving finetuning: LoRA-scale finetuning of the
      backbone with (a) a radially-weighted depth loss keyed to the measured
      compression map, (b) a pose/rim-feature preservation constraint
      (distillation from the frozen teacher on the rim band), and (c) a
      multi-frame consistency term that routes parallax evidence into rim
      depth, closes >=half of the distance-controlled rim penalty on held-out
      scenes, IMPROVES pose (RRA/RTA), and beats the readout head.
    status: refuted-by-control   # EVALS LANDED 2026-08-22 (results aef0f04): plain LoRA (control) MATCHES OR BEATS full rim-loss arm on both held-out seqs — near-rim seq136 -83.5% vs -80.6%, dec_seq132 -33.5% vs -33.3%; plain also wins pose (13.51->11.52 deg vs full 13.51->13.73). CPU paired bootstrap on delivered per_frame (2026-08-22): full-minus-plain +0.038 [+0.017,+0.059] on seq136 = rim losses SIGNIFICANTLY WORSE; seq132 tie [-0.018,+0.035]. The big rim gain is bought by LoRA finetuning per se, not by the rim-targeted terms. Caveat: eval_lora scores euclidean-range, frozen bench rows planar-z — cross-table magnitudes blocked (cpu ticket), within-table comparisons clean. plain-LoRA row PROMOTED to the standing adaptation baseline every method must beat.
    motivation: "Human-directed method track 1 (improving backbones). Every component is dictated by a measured finding: compression map (runs 008b/009), rim-feature dependence (runs 004-007), context-buys-the-center (024B)."
    parent: null
    priority: closed
  - id: H6
    statement: >
      Peripheral cross-frame attention (video architecture): temporal
      attention restricted to rim tokens (the alignment-rich, fusion-starved
      band) injects multi-frame evidence into rim depth at a fraction of full
      temporal attention's cost, breaking the "context buys the center" wall
      that ticket-024B measured.
    status: refuted-on-held-out   # EVALS LANDED 2026-08-22 (results aef0f04): H6.1's train-scene "rim-KV == full-KV" DOES NOT SURVIVE held-out — alltok control -75.9% vs rim -52.2% on seq136, and rim arm makes dec_seq132 WORSE (+3.2% vs alltok -6.2%). CPU paired bootstrap (2026-08-22): rim-minus-alltok +0.177 [+0.163,+0.193] seq136 and +0.027 [+0.015,+0.039] seq132 — significantly worse on BOTH. The 0.48x-FLOPs efficiency claim is not free; the cross-frame module works, restricting it to rim tokens is what fails. Temporal context itself remains real (#22 stride-10: da3_large nymeria -10..-13%) — the surviving question is temporal-scale, not token-subset.
    motivation: "Human-directed method track 2 (efficient fisheye video model). Efficiency angle is principled: rim tokens are ~40% of the cone; the center provably doesn't need temporal help."
    parent: null
    priority: closed
    # status detail: module + trainer + eval CPU-verified (zero-init identity, camera outputs bit-identical via depth-head-only feats copy); training = ticket #36, queued
