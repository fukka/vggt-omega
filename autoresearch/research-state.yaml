    status: refuted   # corruption hypothesis dead, twice-verified: #31 (hands ~ occlusion) and #34 (GT provenance confirmed: with-skeleton depth contains the person, #28 numbers stand; synthetic stream unsuitable as counterfactual — domain gap swamps the effect). Yield: placement measurement + loss hygiene. meal anomaly isolated, open.
