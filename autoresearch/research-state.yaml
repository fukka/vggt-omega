    permutation — never against an independent estimate of the same number.
  does_not_contradict_h35: >
    H35 said 0.46% is AVAILABLE for vggt_omega; H39 says it cannot be collected
    this way because collecting it costs about that much. Second time price and
    prize came out equal for this backbone (H38: +6.0% vs +6.8%).
