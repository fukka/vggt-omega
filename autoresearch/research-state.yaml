  artifact: autoresearch/experiments/h27-gt-arm/results/ (45 eval JSONs)
  analysis: autoresearch/experiments/h27-gt-arm/analysis.md
  every_in_room_number_now_corrected:
    gt_trained: "-57.9% (seq136) -> -40.99% +- 5.42 over 13 (3.12 sd, x1.41)"
    adapter_omega110: "-51.5% -> -38.59% +- 4.86 (2.60 sd, x1.33)"
    control_omega_rt_3seeds: "-47.6% -> -35.14% +- 5.86 (x1.35)"
    curve_16_numbers: "-16.6% -> -7.02% +- 1.67 (5.74 sd, x2.36)"
  ratios_all_improved:
    label_free_fraction: "88.9% -> 94.2%"
    adapter_over_curve: "3.10x -> 5.50x"
    adapter_minus_control: "-3.9 -> -3.44 pts, 13/13 with a full 3-seed control"
  the_pattern_that_explains_it: >
    The three LEARNED arms were inflated by 1.33, 1.35, 1.41; the 16-number
    curve by 2.36. seq136 flattered the WEAKEST method most, which is why every
    ratio improved when the absolute numbers came down.
  practical_consequence: >
    sd/|mean| is 0.238 for the curve against 0.126 for the adapter. A
    16-parameter fit on rim-dominated statistics is far more sequence-sensitive
    than a trained adapter, so claims about the curve need more recordings than
    claims about the adapter.
  what_is_still_open:
    - "The rearranged-room ratio (82%) rests on dec_seq132 alone. Much less worrying — H25 showed it is the representative recording (+0.31 sd) — but it is one recording and should be described as one."
    - "THE LARGEST OPEN EXPOSURE: the cross-room numbers were never measured on seq136, so this arc does not reach them. Still 120 frames over two near-static recordings. No amount of Apartment footage fixes it."

# ------------------------------------- data inventory 2026-09-08, NOT ACTED ON
adt_unused_sequences:
  finding: >
    The raw ADT tree holds 39 non-"clean" Apartment sequences that have never
    been touched: 16 meal, 10 decoration, 9 work, 4 recognition. `decoration` is
    the rearranged-furniture scene — the one H25 showed is the REPRESENTATIVE
    recording — and only seq132 of the ten is extracted.
  why_they_are_unusable_as_they_stand: >
    Their .download_status.json says depth:false, main_groundtruth:false and
    every mps_*:false. Only main_vrs (RGB) was downloaded. No depth to score
    against and no trajectory for pose, so they cannot be used without fetching
    more from the ADT CDN.
  what_it_would_buy: >
    Scaling the rearranged-room test from ONE recording to ten, which is the gap
    H27 flagged as still open (the "82%" companion figure). And 25 meal/work
    sequences would give real scene-content diversity in the same room. It would
    NOT touch the cross-room exposure — LiteOffice is still the only second
    device and there is no more of it anywhere on disk.
  BLOCKED_ON_A_DECISION_NOT_A_TICKET: >
    /netapp/datasets is 98% full: 787 GB free of 31 TB, on a SHARED filesystem
    (aman.walia, dong.huo also use it). A decoration sequence is ~11 GB as
    RGB-only today; with depth+groundtruth+mps it lands nearer 20-25 GB raw, and
    5.9 GB once extracted. Ten of them is ~150-250 GB transient, 15-30% of the
    remaining headroom on a box other people depend on.
  bounded_plan_if_approved: >
    One sequence at a time — download, extract to adt_apartment_extra, delete
    the raw — which caps the transient footprint near 25 GB instead of 250 GB.
    Downloader recipe is in the Mac-local memory note `adt-dataset-downloader`:
    runner dir /user/f.zhang2/Documents/adt_seq131_dl, edit sequences.txt, launch
    ./run.sh in tmux. Env is `myadt`, not `raytun3r`.
  do_not_launch_without_asking: >
    Filling a shared research filesystem past 98% affects colleagues and is not
    reversible from here. Flagged to the user rather than started.

# ------------------------------- H28 part 1 (ratio arm) 2026-09-08
h28_ratio_arm:
  status: B2 PASSES cleanly, B1 MARGINAL — and the asymmetry is the finding
  artifact: autoresearch/experiments/h28-foundation-variance/results/ratio_seq*.json
  b2_seq136_was_representative_here: >
    seq136's published rim/centre of 2.13 sits at -0.11 sd from the
    13-recording mean of 2.171. Its raw rim error (0.389) is likewise ordinary
    against 0.396 +- 0.056. So for the PHENOMENON, seq136 was representative —
    the opposite of what H25-H27 found for the METHODS, where it inflated
    everything by 1.33x to 2.36x.
  b1_marginal_and_the_range_claim_is_wrong: >
    sd/mean = 0.176 for da3:small (bar: pass <0.15, falsified >=0.25) and 0.224
    for da3:large. Neither passes nor falsifies. But the ranges are the real
    problem: da3:small 1.39-2.65 and da3:large 1.14-2.98 across recordings.
  what_must_be_restated: >
    The published claim is "the rim is 2.0-2.6x worse than the centre, IN EVERY
    MODEL". That range was never a spread across models — it was four numbers
    each measured on ONE recording that happened to land close together. Across
    13 recordings the ratio reaches down to 1.14. The MEAN survives (2.17 and
    2.13 against the published 2.13 and 2.04); the tight range does not.
  honest_restatement: >
    "About 2.2x on average, with recording-to-recording spread from roughly 1.4
    to 2.7." The "in every model" half survives; the interval does not.
  roll_arm_still_running: >
    The roll arm (B3) failed on the first attempt: argparse reads a bare
    "-40,-30,..." as a flag, so --angles must use the = form. Relaunched as
    tmux h28b with --angles=-40,... The published +13/+46/+131% at
    +-20/30/40 deg is still unverified across recordings.

gotcha_argparse_negative_list:
  symptom: "roll_controls.py: error: argument --angles: expected one argument"
  cause: >
    A value starting with '-' is parsed as a flag. The runner's DEFAULT
    "-40,-30,..." works because it never passes through argparse; passing the
    same string explicitly fails.
  fix: "--angles=-40,-30,-20,0,20,30,40 (the = form), never a space."
