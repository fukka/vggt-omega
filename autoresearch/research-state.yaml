# ---------------------------------------------------------------- roll line
# Added 2026-09-08. Protocol locked in
# autoresearch/experiments/h17-roll-prior/protocol.md before H17.2/.3 ran.
h17_roll_prior:
  question: >
    Do depth foundation models all assume a level camera; is that assumption
    violated by egocentric data; can the device's own IMU/gravity supply the
    roll; and is feeding it in worth anything?
  status: "3 of 4 sub-hypotheses resolved"
  sub:
    h17_1_distribution:
      status: done
      kind: exploratory measurement
      result: >
        ADT's real head roll, read from the MPS gravity vector over 60,105
        frames: median 3.7 deg, p90 10.2, p99 21.8, max 34.5, none past 40.
        The model's flat zone (+-20 deg) and the data's p99 coincide, measured
        independently. Per-sequence spread is large (seq145 29.6% of frames
        beyond 10 deg vs decoration_seq132 0.8%), so it is activity-dependent.
        Side result: confirms UPRIGHT_K=3 from geometry rather than from a loss.
      resolved_2026_09_08: >
        The recorded uncertainty ("the -2.7 deg signed median could be a real
        head tilt or a constant extrinsics offset, and this measurement cannot
        tell them apart") was itself wrong. A constant offset is per DEVICE, so
        it would be identical on every M1292 sequence. The signed median ranges
        +0.44 to -7.50 deg across 19 sequences on that one device, sd 2.38 — an
        8-degree spread a calibration constant cannot produce. Hypothesis dead.
        The structure is a contiguous BLOCK (seq142-148 sit 4-5 deg further
        tilted), which points at a per-session cause: a different wearer, or the
        device re-seated between sessions. seq144/145, flagged earlier for
        having 26-30% of frames beyond 10 deg, are inside that block, so the
        "activity-dependent" reading was close but not right — it is a
        per-session mounting offset with ordinary head motion on top.
        Practical value: none. A per-session constant de-roll is cheap and would
        remove 5-7 deg on a third of the sequences, but the clean curve prices
        10 deg at +2%, so 6 deg is worth under 1%.
      artefacts: [results/autoresearch-h17-roll/roll_distribution.json]
    h17_2_backbones:
      status: done
      kind: CONFIRMATORY — locked bar PASSED
      result: >
        Rise in all-image AbsRel at 30 deg vs each backbone's own 0 deg, clean
        pinhole arm: da3:small +46%, da3:large +52%, vggt +11%, vggt_omega +11%
        (at 40 deg: +131 / +114 / +23 / +11). Locked prediction was "both VGGT
        variants below DA3-Small and under +30%". The horizontal prior is a
        PRETRAINING-DATA property, not a property of depth estimation, and
        capacity does not substitute — DA3-Large is 2.2x more accurate at 0 deg
        and MORE roll-sensitive at 30. Cheapest roll robustness is the backbone.
      artefacts: [results/autoresearch-h17-roll/roll_backbones_seq136.json]
    h17_3_probe:
      status: done
      kind: CONFIRMATORY — landed BETWEEN the two locked bars
      result: >
        Ridge probe from frozen DA3-Small tokens to the roll angle: MAE 12.75
        deg against a 25.8 deg label-permuted null, R2 0.60 — but 6.8 deg on the
        same-room held-out sequence and 18.7 on the rearranged one. Bars were
        <10 (conditioning inert) and >20 (IMU carries new information); neither
        fired. The features encode roll WITHIN a known room and only weakly in a
        new one, so H15's "conditioning on what it already knows is inert" does
        not transfer. Two protocol expectations broken: the picture-rolled
        control is not easier than the camera-rolled arm (Aria's imaged disc is
        rotationally symmetric, so the wedge leaks nothing), and the first
        readout — (sin, cos) then atan2 — gave MAE 70 deg, worse than a
        constant, because cos spans only [0.707, 1] within +-45 deg.
      artefacts: [results/autoresearch-h17-roll/roll_probe.json]
    h17_5_boundary_or_projection:
      status: done
      kind: CONFIRMATORY — landed BETWEEN the locked thresholds, and the design had a named flaw
      result: >
        Masking the rectified 89 deg view to its inscribed disc rises +84% at
        30 deg (pinhole +46%, fisheye_disc +146%), i.e. "both contribute". But
        the protocol called that mask a near-exact analogue of fisheye_disc and
        it is not — 21.9% of the frame vs 1.7% of the cone — so the 30 deg
        comparison is not a clean decomposition and is reported as such. The
        clean number is 0 deg: 21.9% black on a full rectified frame costs
        +106% all-image, +141% near_rim.
      followup_dose_curve: >
        Border width swept 0 -> 53.4% of the frame, scored at theta <= 30 deg:
        +22 / +13 / +17 / +17 / +6.6 / +32 percent. NO dose-response; only the
        step (border vs none, ~+18%) survives. Combined with the +106% measured
        against the border, the variable is distance, not area. Standing rule
        rewritten above.
      artefacts:
        - results/autoresearch-h17-roll/roll_boundary_seq136.json
        - results/autoresearch-h17-roll/border_dose_seq136.json
    h17_6_border_across_backbones:
      status: done
      kind: CONFIRMATORY — locked prediction FALSIFIED
      result: >
        Cost of one hard border adjacent to the scored zone, all-image AbsRel:
        vggt_omega +29%, da3:small +106%, vggt +107%, da3:large +636%. The
        locked prediction (both VGGT variants under +40%) fails on vggt. Border
        robustness is NOT the pretraining-family property that roll robustness
        is — the two are different axes, and whatever makes VGGT-Omega tolerant
        is not what it shares with VGGT.
      biggest_finding: >
        DA3-Large is the most accurate DA3 on a clean frame (0.0690 vs 0.1545)
        and becomes the WORST of all four with a border (0.5077) — a 7.4x
        degradation from a change that touches no scored pixel. Clean-benchmark
        accuracy does not predict framing robustness.
      decision_it_feeds: >
        The protocol pre-committed: if both VGGT variants came under +40%, run a
        110 deg teacher for H14. Only VGGT-Omega qualified, and it is also the
        most accurate and roll-robust backbone here. NEXT H14 ARM: a 110 deg
        VGGT-Omega teacher — 100% cone coverage, still label-free, dissolving
        H14's accuracy-vs-coverage tension instead of trading along it.
      artefacts: [results/autoresearch-h17-roll/border_backbones_seq136.json]
    h17_4_use_the_gravity:
      status: deprioritised, not run
      why: >
        H17.2 shows the VGGT family is already near roll-invariant (+11% at 30
        deg) and H17.1 shows ADT's p99 roll is 21.8 deg, so on this data there
        is almost nothing for a gravity input to recover. The arms
        (raw/derotate/condition/augment) and their bars stay locked in
        protocol.md for the day a wider-pose egocentric dataset with dense depth
        exists — that dataset, not a method, is this line's bottleneck.
  next:
    - "PRIMARY: a 110 deg VGGT-Omega teacher for H14 (see h17_6). It is the one backbone measured to tolerate a border adjacent to the zone of interest, and it is also the most accurate and the most roll-robust. This is the concrete pay-off of the whole h17 block."
    - "Separating projection from boundary is still open; H17.5's inscribed-disc mask was an order of magnitude more severe than fisheye_disc, so it did not decompose them. Any future attempt must severity-match the two masks."
    - "Find a head-mounted dataset with a wider pose distribution AND dense depth. Without one, H17.4 cannot be worth running."

# ------------------------------------------------------------------ H18
# The pay-off of the h17 block. Bars locked in h17-roll-prior/protocol.md
# before training; results in findings.md.
h18_omega_teacher:
  question: >
    H14 died because its teacher was thin (-14.7% at the rim) and covered only
    70% of the rim band, and widening to 110 deg inverted it. H17.6 showed
    border tolerance is backbone-specific. Does a border-tolerant teacher
    dissolve H14's accuracy-vs-coverage tension?
  status: "3 of 4 locked bars passed"
  result: >
    Pre-check, same 110 deg view and same 22.5% black frame: DA3-Small teacher
    +33/+39% (inverts), VGGT-Omega teacher -65.0%, both at 100% rim coverage.
    Students, no depth labels anywhere: omega110 -52.7% / -22.8% at near_rim on
    the two held-out sequences, i.e. 91% / 84% of what the dense-label ceiling
    buys. H14's own rect arm got -13.2% / +4.7%.
  the_control_that_decides_the_reading: >
    omega_rt (same teacher, same resampling, NO change of projection). The
    decomposition INVERTS between the two tests, and the earlier unqualified
    "teacher strength is first-order" was wrong for the test that matters.
    IN-ROOM (held-out sequence, 3 seeds): omega_rt -47.6+-1.1 / -17.8+-1.0 vs
    omega110 -51.5+-2.0 / -22.4+-1.8, so teacher strength is first-order and
    rectification adds ~3.9 points and causes the near_center failure.
    ACROSS ROOMS (LiteOffice): omega_rt +0.8% / -0.1% — it transfers NOTHING —
    while every rectified arm does (omega110 -20.0 / -9.0, rect -28.5 / -10.7,
    gt -11.8 / -5.0). So H14's own mechanism is what produces a TRANSFERABLE
    improvement; "distil a stronger model" produces a room-specific one.
  claim_now: >
    NOT self-distillation, and it must be stated as two claims because they
    point different ways. IN-ROOM: a frozen stronger model distilled label-free
    recovers 82-89% of the dense-label gain at the rim, and the rectified
    projection is a small part of that. ACROSS ROOMS: only the rectified
    projection survives (and beats dense labels); distilling a stronger model
    transfers nothing. Quoting the in-room number alone gets the mechanism
    backwards. It also requires a stronger model to exist, which
    self-distillation did not.
  trade_off_found: >
    The WEAKER DA3-Small rectified teacher transfers best (-28.5 / -10.7) while
    being far worse in-room (-13.2 / +4.7). Stronger teacher -> more in-room
    gain, slightly less transfer.
  seeds: >
    3 seeds on omega110 and omega_rt. Bar 2 passes on all three; bar 3
    (near_center) fails on all three (+12.4 / +20.1 / +16.9), so that failure is
    robust. The rim advantage of rectification favours omega110 on 6/6
    seed-sequence cells but one seed nearly ties, so it is directionally
    consistent and small rather than decisive.
  artefacts:
    - autoresearch/experiments/h14-rect-distill/results/omega/
    - results/autoresearch-h14-omega/ (on lambda_63 and the results branch)
  next:
    - "Test the mechanism hypothesis directly: is the rectified target transferable because it is a low-dimensional radial relation? Fit a purely radial correction to the omega110 targets and see how much of the cross-room gain a radial-only student reproduces."
    - "Scale the cross-room test. It is now carrying the whole mechanistic claim and it is 120 frames over two near-static sequences."
    - "Does the student saturate in-room? It recovers 82-89% of the label ceiling from a 4.4x stronger teacher; a larger student or LoRA rank would say whether the residual is student capacity."

# ---------------------------------------------------------------- H18.2
h18_2_radial_probe:
  question: >
    H18's cross-room result inverted its in-room one: the un-rectified control
    carries most of the in-room gain and none of the cross-room one. Why does
    the rectified target transfer?
  status: "locked prediction PASSED, emphatically"
  method: >
    Replace the 122.9k LoRA with something that can ONLY express a radial
    relation - one log-log curve per theta bin, 16 parameters - fit on the four
    training sequences only, applied unchanged everywhere. Supervision is the
    same omega110 teacher targets the LoRA saw. `global` (same form, theta
    dependence removed, 2 parameters) is the control.
  result: >
    near_rim vs frozen. radial: seq136 -16.6%, dec_seq132 -6.5%, DinoToy
    -26.0%, BlackCeramicBowl -8.9%. omega110 LoRA: -51.5 / -22.4 / -20.0 /
    -9.0. global: +8.7 / +6.5 / +2.7 / -1.6 (worse than nothing on 3 of 4).
    So IN-ROOM the LoRA is 3x better; ACROSS ROOMS the 16-parameter curve
    matches or beats it. Prediction was ">= half the cross-room gain and beat
    global on both LiteOffice sequences": it reproduced 130% and 99% and beat
    global everywhere.
  the_finding: >
    Sixteen numbers carry everything that crosses a room; the other 122,884
    parameters buy a large in-room gain that transfers not at all. The
    transferable content of the rectified teacher is a per-theta recalibration
    of the frozen model's depth - a property of the LENS, which is why it
    carries to another room and another device. The LoRA's extra capacity fits
    the ROOM.
  convergent_validity: >
    H9 fit the SAME functional form from parallax anchors and got -15.4% on
    seq136 where this gets -16.6%. Two unrelated label-free supervision sources
    converge on the same 16-parameter object and magnitude, and this one does
    not need H9's per-sequence test-time adaptation.
  practical: >
    WITHDRAWN 2026-09-08 by h18_3/h18_4 — the earlier wording ("ship a
    16-number radial calibration") claimed a constant. What stands: a per-theta
    curve fitted on a SUFFICIENT set (240 frames, real motion, wide depth range)
    transfers across rooms and devices and matches a 122,900-parameter LoRA
    there. But the numbers are backbone-specific and depend on the fitting set,
    so it is a CALIBRATION PROCEDURE per (lens, backbone), not a lens constant.
    Still label-free.
  artefacts: [autoresearch/experiments/h14-rect-distill/results/omega/radial_probe.json]
  next:
    - "DONE (h18_3): fitted on LiteOffice and brought back. Gain bar passed (78%/95%) but the coefficient bar failed at 0.493 against a 0.20 falsification line, and a range-matched refit makes the LiteOffice curve WORSE (-7.3%, +1.2%), so that curve is unstable to its fitting pixels rather than describing a different lens."
    - "DONE (h18_4): backbone-specific confirmed, mean |da| 0.297; shape correlates 0.763, level differs by ~0.30."
    - "OPEN: what makes a fitting set sufficient? The Apartment fit is invariant to range matching and the LiteOffice one is not. Sweep the number of fitting frames on the Apartment to find where the curve stabilises — that is the number a calibration procedure would have to quote."
    - "OPEN: scale the cross-room evidence. 120 frames over two near-static sequences now carries several claims."

# --------------------------------------------------------------- h18_3/h18_4
h18_3_lens_constant:
  status: "gain bar PASSED, coefficient bar FAILED — 'lens constant' withdrawn"
  result: >
    LiteOffice-fitted curve applied to the Apartment recovers 78% (seq136) and
    95% (dec_seq132) of the Apartment-fitted gain, against a >=60% bar. But
    mean |a(theta) difference| is 0.493 against a <0.10 bar and a >0.20
    falsification line. Exploratory follow-up: restricting both fits to
    predicted depth 0.5-4.5 m leaves the Apartment fit bit-identical and makes
    the LiteOffice fit worse (-7.3%, +1.2% — harmful on dec_seq132). So the
    LiteOffice curve is unstable to its fitting pixels; 120 near-static frames
    cannot estimate the object. The asymmetry is about the fitting set, not the
    direction.
  artefacts:
    - autoresearch/experiments/h14-rect-distill/results/omega/radial_fit_lite.json
    - autoresearch/experiments/h14-rect-distill/results/omega/radial_apt_rng.json
    - autoresearch/experiments/h14-rect-distill/results/omega/radial_lite_rng.json
  correction_2026_09_08: >
    The depth-range confound H18.3 flagged is NOT what separates the two fits.
    Restricting the fitting pixels to 0.5-4.5 m moves the Apartment `a` by at
    most 0.0057 (4.4% of its spread) and the LiteOffice one by up to 0.5653
    (84.8%). The Apartment mass was already inside that range, so the two sets
    do not differ in effective span. What differs is that LiteOffice's fit
    leans on pixels where the frozen model predicts outside the scene's own
    0.41-4.66 m range — on its own gross errors. The H18.3 conclusion stands;
    its stated reason was wrong.
  open_puzzle: >
    Removing that mass makes LiteOffice's INNER-bin coefficients look more
    Apartment-like while making its transfer WORSE (-12.9% -> -7.3%). The outer
    bins, which are what near_rim scores, barely move. So the difference is
    coming through the evaluation's per-frame scale+shift alignment — a channel
    this project has measured before (82% of one sequence's rim penalty was
    affine placement). Cheap to check when the box returns: re-score under
    scale_only and under a frozen affine; if the gap collapses, it was
    alignment and not correction.
