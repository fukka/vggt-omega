# Research State — Central Project Tracking
# Updated by the agent after each experiment and reflection.

project:
  title: "Peripheral-aware adaptation of depth foundation backbones to Aria fisheye"
  question: >
    How can a frozen (or lightly finetuned) depth foundation backbone be adapted so
    that the high-incidence (peripheral) region of Aria ~110-degree fisheye improves
    without sacrificing central performance — and what is the periphery actually
    good for (depth vs cross-frame alignment vs nothing)?
  status: active
  started: "2026-08-18"
  domain: "3D vision / depth foundation models / fisheye adaptation"

constraints:
