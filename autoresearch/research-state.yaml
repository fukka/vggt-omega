    seq142/144/145 is -3.88% against -0.86% on seq136/138/149. Recorded before
    running.
  THE_ROLL_LINE_END_TO_END: >
    Read the roll from the IMU and fold it into the RENDERING WARP — if you are
    running a single-image backbone. ~2.4% on ordinary indoor footage, ~10% on
    the frames that need it, one rotation of the sampling grid, no labels, no
    training, no model change. On a multi-view-pretrained backbone there is
    nothing to collect. Four parts asked in the opening question, four answered.
