# ------------------------------------------------- H43 resolved 2026-09-08
h43_asymmetry_origin:
  status: "B2 PASSES decisively; B1 marginal; B3 FAILS as locked — CPU only, no new data"
  artifact: autoresearch/experiments/h43-asymmetry-origin/results/summary.json
  analysis: autoresearch/experiments/h43-asymmetry-origin/analysis.md
  the_arithmetic: >
    A device-origin sweep at +-a measures g(psi - a) - g(psi + a). With a
    NEGATIVE signed median psi that is positive EVEN FOR A PERFECTLY SYMMETRIC
    g, because the "+a" arm is sampled further out on a convex curve. Signed
    median across these 13 recordings is -3.10 deg (H17.1: -2.70 over all).
  delta_true_zero_vs_device_zero:
    da3_small:  "+4.70%  ->  +12.5% / +13.5%"
    da3_large:  "+7.77%  ->   +8.7% / +19.4%"
    vggt:       "-6.99%  ->   +9.3% /  +8.7%   <- SIGN FLIP"
    vggt_omega: "-0.87%  ->   +2.9% /  +6.4%"
  B2_DISSOLVES_H42s_CONTRADICTION: >
    H42 found vggt INVERTING against a gravity origin where H33 had it 8/8 the
    other way against a device origin. Same curve gives -6.99% about the true
    zero and +9.29% about the device zero, positive on 10/13 (12/13 quadratic).
    ONE CURVE, TWO ORIGINS, OPPOSITE SIGNS. The zero changed, not the model.
  b1_b3_the_mechanism_does_not_carry_it_all: >
    B1 passes at 31/52 and 32/52 — a 60% majority against a BADLY CHOSEN bar
    (two recordings have non-negative median tilt, where the offset must
    DEFLATE). B3, the bar that actually tested the mechanism, FAILS: Spearman
    -0.345 / -0.441 against a locked <= -0.4 under both extrapolations.
    Honest reading: the origin FLIPS THE SIGN but does not cleanly account for
    the asymmetry, and this cannot say how much of each.
  WHAT_CHANGES_REGARDLESS: >
    NO ASYMMETRY NUMBER IN THIS LINE SURVIVES AS A STATEMENT ABOUT A MODEL.
    H32's "+30 costs 2.3x what -30 costs" is a device-origin measurement on
    footage with a -2.7 deg median tilt and its DIRECTION IS EXACTLY WHAT THE
    OFFSET MANUFACTURES. H33's per-backbone differences inherit it, including
    "da3:large is at chance" — doubly odd, since da3:large has the LARGEST
    true-zero asymmetry of the four (+7.77%).
  defensible_now: "the true-zero column above, at +-22 deg, on one lens."
  rests_on_extrapolation: >
    +-22 was the grid edge, so every device-origin number needed g beyond it,
    computed twice (linear and quadratic). B1 AND B3 WERE EVALUATED ON
    EXTRAPOLATED VALUES; B2 WAS NOT — vggt's true-zero Delta is measured and its
    device-origin Delta is positive under both extrapolations and on 10 and 12
    of 13. That is why B2 is the one quoted.
  SUPERSEDED_BY_H43B: >
    The wide-angle run finished and the extrapolation is gone. B1 goes marginal
    -> PASS (34/52), B3 goes FAIL -> PASS (-0.467), B2 strengthens to 12/13.
    H43's hedge was extrapolation error, not the data. See h43b_no_extrapolation.

h43b_no_extrapolation:
  status: "ALL THREE BARS PASS with nothing extrapolated"
  artifact: autoresearch/experiments/h43-asymmetry-origin/results/noextrap.json
  grid: "-30 .. +30 deg for all four backbones, so every device-origin evaluation at +-22 is an interpolation"
  delta_true_zero_vs_device_zero:
    da3_small:  "+4.70%  ->  +22.36%"
    da3_large:  "+7.77%  ->  +16.92%"
    vggt:       "-6.99%  ->  +10.75%  (positive on 12/13)"
    vggt_omega: "-0.87%  ->   +3.11%"
  bars: "B1 34/52 PASS (was 31-32 marginal); B2 PASS 12/13; B3 -0.467 PASS (was -0.345/-0.441 FAIL)"
  THE_STATEMENT: >
    ROUGHLY FOUR FIFTHS OF THE PUBLISHED ASYMMETRY IS THE ORIGIN. da3:small is
    +22.4 points about the device zero against +4.7 about the true one. For
    scale H32 measured +32.1 points at +-30 against a device origin — same
    direction, larger angle, same order.
  RETIRED: >
    Every published asymmetry number in this line, as a statement about a model.
    H32's "+30 costs 2.3x what -30 costs" and H33's per-backbone differences are
    device-origin measurements on footage with a -3.1 deg median tilt.
  STAYS_UNEXPLAINED_AND_STAYS_THAT_WAY: >
    Delta about the true zero is NOT zero and does NOT have one sign: da3:large
    +7.77% (largest of the four, on the backbone H33 called "at chance"), vggt
    -6.99% (only one dearer on the negative side), da3:small +4.70%, vggt_omega
    -0.87%. H32 found it, H33 could not attribute it, H34 was void, H42 did not
    line up, and H43/H43b explain the PUBLISHED version away without explaining
    the RESIDUAL one. NO MECHANISM OFFERED. What changed: the residual is the
    only version left and it is ~4x smaller than what was published.
  limits:
    - "+-22 deg is the largest angle whose device-origin arms stay inside the measured grid for every recording (mu reaches -7.8)."
    - "mu is the signed median over 15-20 frames per recording, not all 2,880."
    - "Still a prediction from a curve measured on the same footage; the fully independent test is re-running H32's own +-30 sweep against a gravity origin. Not needed for the conclusion, which only requires the two origins to differ — and they do, by a sign, on vggt."

rule_origin_paid_three_times:
  rule: "When a curve looks odd near its origin, suspect the origin."
  instances:
