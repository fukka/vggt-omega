    status: proposed   # brainstorm consensus M2; three agents converged independently on this design. Report RRA@2/@5 + median + hard-pair splits, NEVER RRA@15 (CAM3R saturated it at 99.0/95.0). Optional block L-4 tap for structural pose-depth decoupling (pre-check: measure actual pose drift of the H5 checkpoint first). Falsifier mostly CPU on the H1 harness.
    motivation: "Human direction A (traditional/matching pose). Classical is ~10x more accurate than the learned pose path on solvable pairs (1.5-1.6 vs 14.8 deg median, runs 006/007); learning's role is supplying matches, not replacing the solver."
    parent: H1
    priority: high
  - id: H11
    statement: >
      Parallax-gated epipolar rim attention (re-scoped H6 successor): derotate
      previous-frame tokens on the KB4 sphere (token re-addressing, no pixel
      resampling), rim queries attend to D=16-32 inverse-range hypothesis KV along
      their epipolar curves, KV drawn from t-8/t-16 (metric horizon; token pitch
      ~3 deg needs >=5.5cm baseline) not t-1..t-4 (appearance horizon). Gain must
      rise monotonically with baseline-length bin and vanish in the lowest bin.
    status: blocked-precondition-failed   # 2026-08-22: the gate this was waiting on (#36 held-out evals) CLOSED AGAINST it — rim-KV significantly worse than all-token on both held-out seqs (see H6). The design's premise (rim tokens are where cross-frame evidence pays; restrict KV there for free efficiency) is dead in its efficiency form. What survives is only the temporal-scale claim (metric horizon t-8/t-16 vs appearance horizon, corroborated by #22 stride-10) — if revived, it must be as FULL-field epipolar attention with the temporal-scale claim as the contribution, and it must first beat the plain all-token module which is now the measured stronger baseline. Do not spend GPU here before H12 resolves.
    motivation: "F3 says geometry alone recovers <half the rim gain — H9 needs a content-dependent second stage; this is it, and it is the video-architecture leg of the paper."
    parent: H6
    priority: low
  - id: H12
    statement: >
      Lens-Jacobian conditioning: per-token FiLM on the last ViT block driven by
      the local lens Jacobian shape fields log_area = log(d'(th)*d(th)/sin th)
      and log_aniso = log(d'(th)*sin th/d(th)) (focal length cancels — the field
      encodes the LENS, not the sensor) beats the same architecture + parameter
      count conditioned on a position-SHUFFLED field. If real <= shuffled, stop:
      publish as the fourth controlled negative sealing the global-mismatch reframe.
    status: refuted-by-preregistered-criterion   # PILOT RAN AND LOST 2026-08-22 (results da38331). near-rim AbsRel held-out: seq136 jac 0.2477 vs shuffled 0.2354 vs theta 0.2400; dec_seq132 jac 0.2394 vs shuffled 0.2337 vs theta 0.2334 — jac is WORST of three on BOTH. The criterion was written before the run; GPU stopped, correctly, and did not proceed to ScanNet++. FIFTH controlled negative in the rim-intervention line, and the strongest form available (hand the network the geometry rather than tell it where to try harder). MAC POST-MORTEM 2026-08-24 (data/h12_gradient_and_field_sensitivity_2026-08-24.md), neither part a rescue: (1) jac-minus-control is MONOTONE IN THETA — count-weighted corr(diff,theta) +0.66 seq132 / +0.24 seq136 vs BOTH controls; seq132's nearest-depth column is perfectly monotone across all 8 rings (-0.092 on axis -> +0.019 at 51.4 deg). Real geometry helps on axis (beating theta-only too, so it is the Jacobian CONTENT not just a smooth radial field) and hurts at the rim. (2) the field is 10-40x less determined at the rim: +-1% per-coefficient KB4 perturbation swings log_aniso ~2% of its value at 30 deg but ~12% at 54.83 deg (summed over coefficients ~5% vs ~31%). Reading: conditioning pays where the field is well-determined, costs where it is not, crossover near the 45-50 deg turnover. Geometric conditioning is a CENTRE tool on this lens and must never again be sold as a rim fix. Gap: eval_cond.py emits no per_frame, so H12 alone among the kills has no error bars — cheap re-emit requested.
    # superseded status detail (pre-run): primitive + FiLM + 3 arms built, 10 CPU tests green, zero-init = bit-identical start pinned by test. Motivating measurement: on Aria's calib log_area PEAKS at 48.9 deg then FALLS; log_aniso crosses ZERO near 50 deg, -0.191 at 54.83 — the rim band differs in KIND, so any monotone-in-theta scalar weight (H5's form) cannot represent it: a concrete mechanism for H5's loss to its control. Pilot bug already caught pre-run: checkpoint filter saved ZERO LoRA tensors (fixed 5ce4fca, found by tensor-norm audit not by any error). Loss is PLAIN (alpha=0) to avoid re-importing the refuted rim weighting. Open question flagged: is the near-rim non-monotonicity physical or a KB4-fit artefact.
    motivation: "The unifying reframe after three rim-targeted losses to controls (H5, H6, H7+MoE) while global lens ops win (rect_derect, plain LoRA): the rim deficit is a GLOBAL lens-prior mismatch whose symptom is loudest at the rim. Feed the network the local image-formation geometry instead of telling it where to try harder. Transfer story: f cancels -> same field family on any lens -> ScanNet++ 170-deg cross-lens row becomes the test of the claim, aligning with H9's GT-free framing. OUTCOME: the reframe SURVIVES an experiment built to exploit it and failing — which strengthens rather than weakens it, since the failure mode is again 'the rim is not separable'."
    parent: H5
    priority: closed
  - id: H13
    statement: >
      Distillation ladder: with VGGT-1B teacher predictions cached offline
      (depth + conf, native convention recorded in the manifest), a ladder of
      small student architectures can be trained teacher-free and compared for
      the accuracy/cost frontier on fisheye — the efficiency leg of the paper.
    status: proposed-infrastructure-built   # registered by GPU-Claude 2026-08-24 (organized 3afbace): cache_teacher.py measures VGGT-1B at 1157.9M params / 5.50GB peak / 70ms per frame at 504px, so caching is what makes an architecture ladder affordable at all. conf cached deliberately (whether the teacher KNOWS it degrades toward the rim is a separate question). MAC WARNINGS ATTACHED 2026-08-24, both from evidence already in this repo: (1) slamfov #23 measured VGGT-Omega as the model with the STEEPEST rim error field of the five tested (1.83/1.96 standardised vs dav2_large 1.41/1.57) — a student matching this teacher everywhere INHERITS the worst rim behaviour of any model we benchmarked, so the rim must be supervised by GT/geometry, not by the teacher. (2) the DAv2 Phase-A gate already measured that VGGT-confidence gating UNDERPERFORMS ungated (a1 0.0474 vs a0 0.0469) because conf is high on easy central textured pixels and low exactly on the periphery/edges where the error lives — conf-weighted distillation would actively down-weight the band this project exists to fix. Use conf as the target of a "does the teacher know?" probe, never as a loss weight; VGGT's own multi-view consistency (1-r)^pow was the better signal there. PRECONDITION NOT CLEARED: the brainstorm killed "distillation student (now)" pending F3's apartment-overfit question — either clear F3 first or scope H13 to the efficiency frontier (params/latency at matched accuracy) rather than to generalisation.
    motivation: "The human's original brief included efficient architectures. After five region-targeted depth methods lost to their controls, the constructive space that remains is (a) GT-free global adaptation (H9) and (b) the accuracy/cost frontier — H13 is (b), and it is orthogonal to the rim question rather than another attempt at it."
