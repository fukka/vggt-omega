    h45-mirror-equivariance/correction.md.
  absolute_numbers_standing_rule_2: >
    normal AbsRel 0.048 / 0.073 / 0.131 / 0.058; mirror 0.071 / 0.115 / 0.412 /
    0.226 (vggt_omega / vggt / da3:small / da3:large). NOTHING COLLAPSES — the
    verb is "degrades substantially", not "breaks".
  b3_is_what_makes_it_a_result: "flip-twice differs from untouched by 0.000000% on every recording and backbone"
  family_split: >
    NO OVERLAP: every DA3 value >= +182.7%, every VGGT value <= +99.4%. Same
