    statement: >
      Benchmark matrix on public datasets with published baselines, both
      tasks: depth (AbsRel/delta1, radial breakdown) and pose (RRA/RTA@15)
      on ADT + ScanNet++ (+ KITTI-360/TUM-VI/WideDepth as available), against
      DAC, UniK3D, DA3, VGGT-Omega, RayTun3R, Fisheye3R, CAM3R (the last
