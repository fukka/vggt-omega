    status: pending   # 2026-08-21 slamfov #23 radial half landed (results 8e5fb5e): oracle null reads 1.63-2.84x pooled rim effect with ZERO field dependence -> distance-standardised spread is the only citable form; ALL 5 models exceed the null after standardisation (vggt_omega 1.83/1.96, dav2_large 1.41/1.57 vs null 1.10/1.26) -> rim degradation REAL on real footage; accuracy and evenness are different axes (vggt_omega best absolute AND steepest field). ADOPT: oracle-null row + two-way table in our bench protocol. #40 replanned by GPU recon: ADT has NO non-Apartment scene (184 Apartment + 52 Lite object-recog); bedroom segment in seq132 (502 frames, annotated) -> cross-ROOM probe, ladder cross-sequence < cross-room < cross-building. #41 Part B unblocked (meshes + renderpy present; only render_depth missing). 2026-08-22 (results 1158e27): the oracle null is NOT one number — nymeria falls with strata count (1.295@4 -> 1.129@10, still falling = coarseness) but aea PLATEAUS ~1.10 from 6 strata (residual is something else); null GROWS with model error size (sigma 0.05->0.30m: aea 1.068->1.169, nymeria 1.087->1.283) because AbsRel=|err|/GT and the rim sees nearer surfaces -> a per-MODEL null (matched to that model's own error scale) is required; one shared null under-credits noisy models. #38 v2 (aef0f04): double-conversion fix FLIPPED a conclusion — adaptation now helps seq136 (whole -7.2%, near-rim -15.6%) and hurts dec_seq132 (+47.3%/+37.6%); mixed, no v1 number citable.
