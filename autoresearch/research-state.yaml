# Research State — Central Project Tracking
# Updated by the agent after each experiment and reflection.

project:
  title: "Peripheral-aware adaptation of depth foundation backbones to Aria fisheye"
  question: >
    How can a frozen (or lightly finetuned) depth foundation backbone be adapted so
    that the high-incidence (peripheral) region of Aria ~110-degree fisheye improves
    without sacrificing central performance — and what is the periphery actually
    good for (depth vs cross-frame alignment vs nothing)?
  status: active
  started: "2026-08-18"
  domain: "3D vision / depth foundation models / fisheye adaptation"

constraints:
  - "This machine is CPU-Claude (Mac, no usable GPU). GPU runs go through GitHub issues labelled gpu; lambda_63 box. See docs/handoff/POLICY.md."
  - "git add explicit paths only, NEVER -A (two sessions share this working tree)."
  - "Working venv for CPU torch: recreate python3.9 + torch 2.2.2 + numpy<2 per raytun3r memory; DA3-Small runs on Mac CPU."
  - "Local data on Mac: ADT sample (see local-adt-sample memory), ScanNet++ 3f15a9266d sample at ~/Desktop/ADT/scannetpp_example/ (licensed — never commit content, only statistics)."
  - "Known confounds to control in ANY radial claim: depth-vs-eccentricity (fov.py distance control), dead-pixel layout (ring tilt), resampling asymmetry, one-frozen-affine U-shape artifact, denominator/coverage bugs."

literature:
  survey: "docs/research/fisheye-wide-fov-adaptation.md (2026-07-29, 1283 lines, verified sources) + autoresearch/literature/"
  key_papers:
    - id: vggt360
      title: "VGGT-360 (CVPR26)"
      relevance: "anchor A: training-free tangent-view + fusion; ported in VGGT-360-fisheye/"
    - id: raytun3r
      title: "RayTun3R (arXiv:2607.02711)"
      relevance: "anchor B: 10.7k-param polar PE residual on frozen backbone; reproduced in raytun3r/ (read raytun3r/PAPER.md)"
    - id: cam3r
      title: "CAM3R (arXiv:2603.22631)"
      relevance: "anchor C: SH ray module + ray-aware global alignment; reports ADT numbers (99.0/95.0 RRA/RTA@15); reproduced in cam3r/"
    - id: fisheye3r
      title: "Fisheye3R (ECCV26)"
      relevance: "calibration tokens; our reproduction is the only implementation"
    - id: darswin
      title: "DarSwin (ICCV23, arXiv:2304.09691)"
      relevance: "distortion-aware radial tokenization — the prior art for axis N2"
    - id: caltokens_yale
      title: "Calibration Tokens for fisheye depth (arXiv:2508.04928)"
      relevance: "independent confirmation of token-based adaptation for depth"
    - id: widedepth
      title: "WideDepth benchmark (arXiv:2605.24074)"
      relevance: "mm-accurate fisheye depth benchmark — candidate external eval"
    - id: pomato
      title: "POMATO (arXiv:2504.05692)"
      relevance: "pointmap matching + temporal motion for dynamic 3D — axis N4 prior art"
    - id: reviv
      title: "ReViV (4D egocentric reconstruction)"
      relevance: "axis N4: joint viewer/view modeling, hands+depth"
  open_problems:
    - "No published method targets the center-vs-periphery Pareto front explicitly; adapters report whole-image means."
    - "Periphery's value for cross-frame alignment (large parallax at outer FOV, SLAM folklore) is unquantified for feed-forward depth FMs."
    - "Dynamic hand regions in egocentric fisheye: no adapter paper handles them; ADT has GT to measure it."
    - "Radial metrics in the wild are confounded by depth-vs-eccentricity; this repo has the only control (slambench/fov.py) we know of."

hypotheses:
  - id: H5
    statement: >
      Rim-targeted, pose-preserving finetuning: LoRA-scale finetuning of the
      backbone with (a) a radially-weighted depth loss keyed to the measured
      compression map, (b) a pose/rim-feature preservation constraint
      (distillation from the frozen teacher on the rim band), and (c) a
      multi-frame consistency term that routes parallax evidence into rim
      depth, closes >=half of the distance-controlled rim penalty on held-out
      scenes, IMPROVES pose (RRA/RTA), and beats the readout head.
    status: refuted-by-control   # EVALS LANDED 2026-08-22 (results aef0f04): plain LoRA (control) MATCHES OR BEATS full rim-loss arm on both held-out seqs — near-rim seq136 -83.5% vs -80.6%, dec_seq132 -33.5% vs -33.3%; plain also wins pose (13.51->11.52 deg vs full 13.51->13.73). CPU paired bootstrap on delivered per_frame (2026-08-22): full-minus-plain +0.038 [+0.017,+0.059] on seq136 = rim losses SIGNIFICANTLY WORSE; seq132 tie [-0.018,+0.035]. The big rim gain is bought by LoRA finetuning per se, not by the rim-targeted terms. Caveat: eval_lora scores euclidean-range, frozen bench rows planar-z — cross-table magnitudes blocked (cpu ticket), within-table comparisons clean. plain-LoRA row PROMOTED to the standing adaptation baseline every method must beat.
    motivation: "Human-directed method track 1 (improving backbones). Every component is dictated by a measured finding: compression map (runs 008b/009), rim-feature dependence (runs 004-007), context-buys-the-center (024B)."
    parent: null
    priority: closed
  - id: H6
    statement: >
      Peripheral cross-frame attention (video architecture): temporal
      attention restricted to rim tokens (the alignment-rich, fusion-starved
      band) injects multi-frame evidence into rim depth at a fraction of full
      temporal attention's cost, breaking the "context buys the center" wall
      that ticket-024B measured.
    status: refuted-on-held-out   # EVALS LANDED 2026-08-22 (results aef0f04): H6.1's train-scene "rim-KV == full-KV" DOES NOT SURVIVE held-out — alltok control -75.9% vs rim -52.2% on seq136, and rim arm makes dec_seq132 WORSE (+3.2% vs alltok -6.2%). CPU paired bootstrap (2026-08-22): rim-minus-alltok +0.177 [+0.163,+0.193] seq136 and +0.027 [+0.015,+0.039] seq132 — significantly worse on BOTH. The 0.48x-FLOPs efficiency claim is not free; the cross-frame module works, restricting it to rim tokens is what fails. Temporal context itself remains real (#22 stride-10: da3_large nymeria -10..-13%) — the surviving question is temporal-scale, not token-subset.
    motivation: "Human-directed method track 2 (efficient fisheye video model). Efficiency angle is principled: rim tokens are ~40% of the cone; the center provably doesn't need temporal help."
    parent: null
    priority: closed
    # status detail: module + trainer + eval CPU-verified (zero-init identity, camera outputs bit-identical via depth-head-only feats copy); training = ticket #36, queued
  - id: BENCH
    statement: >
      Benchmark matrix on public datasets with published baselines, both
      tasks: depth (AbsRel/delta1, radial breakdown) and pose (RRA/RTA@15)
      on ADT + ScanNet++ (+ KITTI-360/TUM-VI/WideDepth as available), against
      DAC, UniK3D, DA3, VGGT-Omega, RayTun3R, Fisheye3R, CAM3R (the last
      three have working reproductions IN THIS REPO).
    status: pending   # 2026-08-21 slamfov #23 radial half landed (results 8e5fb5e): oracle null reads 1.63-2.84x pooled rim effect with ZERO field dependence -> distance-standardised spread is the only citable form; ALL 5 models exceed the null after standardisation (vggt_omega 1.83/1.96, dav2_large 1.41/1.57 vs null 1.10/1.26) -> rim degradation REAL on real footage; accuracy and evenness are different axes (vggt_omega best absolute AND steepest field). ADOPT: oracle-null row + two-way table in our bench protocol. #40 replanned by GPU recon: ADT has NO non-Apartment scene (184 Apartment + 52 Lite object-recog); bedroom segment in seq132 (502 frames, annotated) -> cross-ROOM probe, ladder cross-sequence < cross-room < cross-building. #41 Part B unblocked (meshes + renderpy present; only render_depth missing). 2026-08-22 (results 1158e27): the oracle null is NOT one number — nymeria falls with strata count (1.295@4 -> 1.129@10, still falling = coarseness) but aea PLATEAUS ~1.10 from 6 strata (residual is something else); null GROWS with model error size (sigma 0.05->0.30m: aea 1.068->1.169, nymeria 1.087->1.283) because AbsRel=|err|/GT and the rim sees nearer surfaces -> a per-MODEL null (matched to that model's own error scale) is required; one shared null under-credits noisy models. #38 v2 (aef0f04): double-conversion fix FLIPPED a conclusion — adaptation now helps seq136 (whole -7.2%, near-rim -15.6%) and hurts dec_seq132 (+47.3%/+37.6%); mixed, no v1 number citable.
    motivation: "Human-directed: no CVPR paper without it. The in-repo reproductions are the unfair advantage — most labs cannot run these baselines."
    parent: null
    priority: high
    # status detail: frozen-row machinery smoke-tested; 6 models x 2 held-out scenes = ticket #37, queued; RayTun3R comparison row ticket held until the GPU queue drains
    # 2026-08-19 gap analysis (paper/comparison-protocol.md): to "compare the same way" as RayTun3R we still need (a) a Center-PH baseline — their strong depth baseline and our perfect anti-rim foil, buildable on this Mac's CPU; (b) at least one public dense-GT dataset — ScanNet++ 3f15 first (raytun3r/ already loads it, audit done, AND it is RayTun3R's named sequence = external published anchor); (c) an explicit adaptation-data column (none / test-scene TTA / other-scene GT) since their protocol is unsupervised TTA and ours is supervised cross-scene.
  - id: H7
    statement: >
      Theta-conditioned LoRA: gating the low-rank update by incidence angle,
      dW(x) = B diag(g(theta)) A, matches or beats uniform LoRA (H5) at equal
      or smaller rank, because the measured failure field (run_009) is a
      smooth function of theta and uniform LoRA wastes capacity spending it
      isotropically.
    status: refuted   # all three predictions failed: gated==uniform at r=8 AND r=4 (0.572/0.567, 0.754/0.753); gate curve flat (|g-1|~0.06). Mechanism: PE already puts spatially-varying corrections inside uniform LoRA's hypothesis class. Kept as a paper ablation; no GPU spend.
    motivation: "Model-level novelty per human directive; input-geometry-conditioned PEFT is unclaimed in the 2026-08-19 survey; inference-free (g(theta) precomputable per token)."
    parent: H5
    priority: closed
  - id: H8
    statement: >
      Equal-solid-angle tokenization: resampling KB4 input to an equal-area
      patch grid removes the center-oversampling gradient at source and cuts
      tokens ~35-40% at 110 deg FOV; probe question first — does a remap-only
      forward (no training) already move the radial bias field?
    status: refuted   # Probe A 2026-08-19: equisolid remap degrades EVERY zone (+16..+31%) at equal tokens — radial failure is not sampling density; efficiency parity dead a fortiori. Part of the input-surgery-hurts pattern (H3/Center-PH/H8 vs feature/loss-side fixes).
    motivation: "Efficiency-headline candidate; complements H6 (fewer tokens) and attacks K2's gradient at its cause."
    parent: null
    priority: closed
  - id: H1
    statement: >
      Peripheral pose value: on Aria-like fisheye, restricting correspondences to the
      peripheral band (theta > ~40deg) yields BETTER relative-pose estimates per
      correspondence than the central band under rotation-dominant egocentric motion,
      because angular parallax at the rim disambiguates rotation. Prediction: classical
      SIFT+MAGSAC++ pose error, count-matched, is lower for rim-only than center-only
      keypoint sets on the same frame pairs.
    status: refuted   # runs 001-002: flat synth control, coin-flip paired diff; see experiments/h1-rim-pose-value/analysis.md
  - id: H1.1
    statement: >
      The periphery's pose value is angular SPAN at fixed count: cumulative disks
      theta<=T with count matched show rotation/translation error falling
      monotonically with T; the 65->85deg band still contributes.
    status: supported   # run 003: 17/17 pairs, median -2.15deg; synth control shows conditioning alone is ~20x smaller
  - id: H1.2
    statement: >
      Frozen depth FMs effectively ignore the periphery for alignment: masking the
      rim (theta > ~35-45deg) of the input changes DA3-Small's rotation gain by
      much less than the classical span curve predicts (0.89 -> 0.93+ available).
    status: refuted   # run 004: the OPPOSITE — center-masked == vanilla, rim-masked 2.5x worse; the model's pose lives in the periphery
    motivation: "Links H1.1's recoverable span value to the adapter's job; CPU-runnable (DA3-Small on Mac)."
    parent: H1
    priority: closed
  - id: H1.3
    statement: >
      The span (H1.1) and rim-dependence (H1.2) findings transfer from the ~170deg
      DSLR scene to real Aria 110deg KB4 fisheye (local ADT seq131), with GT
      obtained via a gate-verified hand-eye extrinsics bootstrap.
    status: supported   # runs 006-007: span replicates (saturates ~45deg); rim-dependence replicates softer (rim >> area-matched random > center); see analysis.md
    motivation: "Closes the lens-generalization caveat on the target domain."
    parent: H1
    priority: high
  - id: H2.0
    statement: >
      Depth baseline: DA3-Small's radial error curve on Aria seq131 survives the
      GT-depth control.
    status: supported   # run_008b + run_009: real, and it is precise miscalibration (depth-range compression, radially modulated), not noise — dispersion is 2-10% everywhere.
    parent: H2
    priority: high
  - id: H2.1
    statement: >
      The near-field-rim failure is a fixed, transferable miscalibration a
      48-param (theta x predicted-depth) table can fix on held-out frames.
    status: refuted   # partially: near-rim -18..-25% transfers (the table is now the mandatory baseline), but near-center collateral shows output-indexed correction cannot invert the compression
    parent: H2
    priority: closed
  - id: H2.2
    statement: >
      Frozen-feature head (25k params, readout-side, pose untouched) beats the
      H2.1 table at the near rim without near-center collateral.
    status: supported   # run_011 + ticket #29: ALL SIX sequences confirm (-21..-75% near-rim, near-center within noise); flagged cell was 392px noise
    parent: H2
    priority: high
  - id: H2.3
    statement: >
      One feature head trained on five scenes transfers to the held-out sixth
      at >= half the within-scene gain.
    status: supported   # ticket #32: five clean folds -74.5..-78.0% (>= within-scene!); decoration fold -18.7% (over the bar) but with real center collateral — genre shift is the boundary. 48-param cross-scene control not run (flagged).
    parent: H2
    priority: high
  - id: H2.4
    statement: >
      The head recipe transfers to VGGT-Omega (highest-headroom backbone) with
      gains comparable to DA3-Small's.
    status: supported-with-caveats   # ticket #33: near-rim improves on all 12 runs (-19..-41%) but never DA3's -60/-70%, and halves-split center collateral up to +50% — final-block tokens carry less signal; earlier-block probe = future work.
    parent: H2
    priority: high
  - id: H2
    statement: >
      Center-safe adaptation: an INPUT-CONDITIONED zero-init adapter (image
      evidence, not output-indexed) improves near-field-rim depth beyond the
      H2.1 table without near-center collateral and without moving pose.
      Established per-scene (6 seqs), cross-scene within genre, and
      directionally across backbones. Open: genre shift, VGGT-Omega collateral,
      multi-frame routing rung.
    status: active
    motivation: "Novelty axis N1. The adapter exists in raytun3r/; the new part is band-restricted training + Pareto (center,periphery) reporting."
    parent: null
    priority: high
  - id: H3
    statement: >
      Distortion-adaptive tokenization: resampling patches by the local KB4
      linearization (RayTun3R's parameter-free piece, akin to DarSwin's radial
      tokenization) reduces peripheral feature degradation at equal token budget,
      measurable as improved rim depth/edge-alignment with NO trained parameters.
    status: refuted   # run_014b: tables unchanged to 3rd decimal; mechanism measured — within-patch distortion on Aria KB4 is <=0.2px even at the rim; distortion lives BETWEEN patches. N2 patch-content branch closed with a number.
    motivation: "Novelty axis N2, cheapest entry point: parameter-free, partially CPU-testable with DA3-Small."
    parent: null
    priority: closed
  - id: H4
    statement: >
      Dynamic-region handling: hand/dynamic pixels in ADT contribute a measurable,
      disproportionate share of depth error and correspondence outliers; masking them
      (GT masks first, predicted later) improves both static depth eval and pose.
    status: refuted   # corruption hypothesis dead, twice-verified: #31 (hands ~ occlusion) and #34 (GT provenance confirmed: with-skeleton depth contains the person, #28 numbers stand; synthetic stream unsuitable as counterfactual — domain gap swamps the effect). Yield: placement measurement + loss hygiene. meal anomaly isolated, open.
    motivation: "Novelty axis N4 — now measured to overlap the compression zone and the pose-critical band; the four axes unify at the near-field rim."
    parent: null
    priority: closed
  - id: H9
    statement: >
      Self-supervised radial-field removal (RayCal-TTA): classical bearing-space
      pose -> triangulated full-FOV range anchors -> fit and remove the backbone's
      radial compression field WITHOUT depth labels, so one affine serves the whole
      image (the F4 criterion). Framed as GT-free adaptation to an unseen camera.
      Application-step fork to settle empirically: analytic log-linear g(theta),c(theta)
      inverse (Opus) vs anchor-pseudo-labeled feature-conditioned center-zero field
      head (Fable; dodges the H2.1/F3 output-indexed ceiling).
    status: proposed   # multi-agent brainstorm consensus M1 (literature/2026-08-19-arch-brainstorm/synthesis.md). Locked bar: scale_shift<->frozen-affine gap must COLLAPSE, not just the aligned number drop. Day-1 oracle-pose arm; g(theta) must match run_009's GT field. PRE-CHECKS FIRST: two-annuli (run_006 outer arm at adequate n), Aria SLAM-cam stereo availability, hand motion-consistency gate in every falsifier.
    motivation: "Human-directed decoupling brainstorm 2026-08-19. Pose->depth arrow; converts F8 (one apartment) from liability to headline since adaptation needs video, not labels."
    parent: null
    priority: high
  - id: H10
    statement: >
      Decoupled pose stream (FrozenMatch): detector-free coarse-to-fine matching on
      FROZEN backbone features (zero extra encoder pass), exact KB4 ray lift,
      classical spherical solver, coverage-stratified RANSAC (never theta-weighting,
      per H1), full-field not rim-only (run_007: center deletion costs +5.3 deg).
      Beats the measured bottleneck: SIFT solves only 15/59 Aria pairs.
    status: proposed   # brainstorm consensus M2; three agents converged independently on this design. Report RRA@2/@5 + median + hard-pair splits, NEVER RRA@15 (CAM3R saturated it at 99.0/95.0). Optional block L-4 tap for structural pose-depth decoupling (pre-check: measure actual pose drift of the H5 checkpoint first). Falsifier mostly CPU on the H1 harness.
    motivation: "Human direction A (traditional/matching pose). Classical is ~10x more accurate than the learned pose path on solvable pairs (1.5-1.6 vs 14.8 deg median, runs 006/007); learning's role is supplying matches, not replacing the solver."
    parent: H1
    priority: high
  - id: H11
    statement: >
      Parallax-gated epipolar rim attention (re-scoped H6 successor): derotate
      previous-frame tokens on the KB4 sphere (token re-addressing, no pixel
      resampling), rim queries attend to D=16-32 inverse-range hypothesis KV along
      their epipolar curves, KV drawn from t-8/t-16 (metric horizon; token pitch
      ~3 deg needs >=5.5cm baseline) not t-1..t-4 (appearance horizon). Gain must
      rise monotonically with baseline-length bin and vanish in the lowest bin.
    status: blocked-precondition-failed   # 2026-08-22: the gate this was waiting on (#36 held-out evals) CLOSED AGAINST it — rim-KV significantly worse than all-token on both held-out seqs (see H6). The design's premise (rim tokens are where cross-frame evidence pays; restrict KV there for free efficiency) is dead in its efficiency form. What survives is only the temporal-scale claim (metric horizon t-8/t-16 vs appearance horizon, corroborated by #22 stride-10) — if revived, it must be as FULL-field epipolar attention with the temporal-scale claim as the contribution, and it must first beat the plain all-token module which is now the measured stronger baseline. Do not spend GPU here before H12 resolves.
    motivation: "F3 says geometry alone recovers <half the rim gain — H9 needs a content-dependent second stage; this is it, and it is the video-architecture leg of the paper."
    parent: H6
    priority: low
  - id: H12
    statement: >
      Lens-Jacobian conditioning: per-token FiLM on the last ViT block driven by
      the local lens Jacobian shape fields log_area = log(d'(th)*d(th)/sin th)
      and log_aniso = log(d'(th)*sin th/d(th)) (focal length cancels — the field
      encodes the LENS, not the sensor) beats the same architecture + parameter
      count conditioned on a position-SHUFFLED field. If real <= shuffled, stop:
      publish as the fourth controlled negative sealing the global-mismatch reframe.
    status: refuted-by-preregistered-criterion   # PILOT RAN AND LOST 2026-08-22 (results da38331). near-rim AbsRel held-out: seq136 jac 0.2477 vs shuffled 0.2354 vs theta 0.2400; dec_seq132 jac 0.2394 vs shuffled 0.2337 vs theta 0.2334 — jac is WORST of three on BOTH. The criterion was written before the run; GPU stopped, correctly, and did not proceed to ScanNet++. FIFTH controlled negative in the rim-intervention line, and the strongest form available (hand the network the geometry rather than tell it where to try harder). MAC POST-MORTEM 2026-08-24 (data/h12_gradient_and_field_sensitivity_2026-08-24.md), neither part a rescue: (1) jac-minus-control is MONOTONE IN THETA — count-weighted corr(diff,theta) +0.66 seq132 / +0.24 seq136 vs BOTH controls; seq132's nearest-depth column is perfectly monotone across all 8 rings (-0.092 on axis -> +0.019 at 51.4 deg). Real geometry helps on axis (beating theta-only too, so it is the Jacobian CONTENT not just a smooth radial field) and hurts at the rim. (2) the field is 10-40x less determined at the rim: +-1% per-coefficient KB4 perturbation swings log_aniso ~2% of its value at 30 deg but ~12% at 54.83 deg (summed over coefficients ~5% vs ~31%). Reading: conditioning pays where the field is well-determined, costs where it is not, crossover near the 45-50 deg turnover. Geometric conditioning is a CENTRE tool on this lens and must never again be sold as a rim fix. Gap: eval_cond.py emits no per_frame, so H12 alone among the kills has no error bars — cheap re-emit requested.
    # superseded status detail (pre-run): primitive + FiLM + 3 arms built, 10 CPU tests green, zero-init = bit-identical start pinned by test. Motivating measurement: on Aria's calib log_area PEAKS at 48.9 deg then FALLS; log_aniso crosses ZERO near 50 deg, -0.191 at 54.83 — the rim band differs in KIND, so any monotone-in-theta scalar weight (H5's form) cannot represent it: a concrete mechanism for H5's loss to its control. Pilot bug already caught pre-run: checkpoint filter saved ZERO LoRA tensors (fixed 5ce4fca, found by tensor-norm audit not by any error). Loss is PLAIN (alpha=0) to avoid re-importing the refuted rim weighting. Open question flagged: is the near-rim non-monotonicity physical or a KB4-fit artefact.
    motivation: "The unifying reframe after three rim-targeted losses to controls (H5, H6, H7+MoE) while global lens ops win (rect_derect, plain LoRA): the rim deficit is a GLOBAL lens-prior mismatch whose symptom is loudest at the rim. Feed the network the local image-formation geometry instead of telling it where to try harder. Transfer story: f cancels -> same field family on any lens -> ScanNet++ 170-deg cross-lens row becomes the test of the claim, aligning with H9's GT-free framing. OUTCOME: the reframe SURVIVES an experiment built to exploit it and failing — which strengthens rather than weakens it, since the failure mode is again 'the rim is not separable'."
    parent: H5
    priority: closed
  - id: H13
    statement: >
      Distillation ladder: with VGGT-1B teacher predictions cached offline
      (depth + conf, native convention recorded in the manifest), a ladder of
      small student architectures can be trained teacher-free and compared for
      the accuracy/cost frontier on fisheye — the efficiency leg of the paper.
    status: proposed-infrastructure-built   # registered by GPU-Claude 2026-08-24 (organized 3afbace): cache_teacher.py measures VGGT-1B at 1157.9M params / 5.50GB peak / 70ms per frame at 504px, so caching is what makes an architecture ladder affordable at all. conf cached deliberately (whether the teacher KNOWS it degrades toward the rim is a separate question). MAC WARNINGS ATTACHED 2026-08-24, both from evidence already in this repo: (1) slamfov #23 measured VGGT-Omega as the model with the STEEPEST rim error field of the five tested (1.83/1.96 standardised vs dav2_large 1.41/1.57) — a student matching this teacher everywhere INHERITS the worst rim behaviour of any model we benchmarked, so the rim must be supervised by GT/geometry, not by the teacher. (2) the DAv2 Phase-A gate already measured that VGGT-confidence gating UNDERPERFORMS ungated (a1 0.0474 vs a0 0.0469) because conf is high on easy central textured pixels and low exactly on the periphery/edges where the error lives — conf-weighted distillation would actively down-weight the band this project exists to fix. Use conf as the target of a "does the teacher know?" probe, never as a loss weight; VGGT's own multi-view consistency (1-r)^pow was the better signal there. PRECONDITION NOT CLEARED: the brainstorm killed "distillation student (now)" pending F3's apartment-overfit question — either clear F3 first or scope H13 to the efficiency frontier (params/latency at matched accuracy) rather than to generalisation.
    motivation: "The human's original brief included efficient architectures. After five region-targeted depth methods lost to their controls, the constructive space that remains is (a) GT-free global adaptation (H9) and (b) the accuracy/cost frontier — H13 is (b), and it is orthogonal to the rim question rather than another attempt at it."
    parent: null
    priority: medium

