# ------------------------------------------- H44 VOID / H45 resolved 2026-09-08
h44_mirror_asymmetry:
  status: VOID — its own mandatory B0 failed by an order of magnitude
  what_it_wanted: >
    Use a mirror to separate two explanations for the RESIDUAL roll asymmetry:
    carried by the scene as the model sees it (should flip sign under mirroring)
    vs a handedness fixed in the model's image space (should not).
  construction_was_right_this_time: >
    Mirrored in the RENDERED VIEW, not the fisheye source: the virtual pinhole
    has cx = (width-1)/2 exactly, planar z is a scalar so flipping the prediction
    back is exact, and the GT is NEVER TOUCHED because the prediction returns to
    the original frame before scoring. That is what H34 got wrong.
  why_void: >
    B0 (mirroring a LEVEL frame must cost under 25%) came out +50% to +450%. The
    mirror moves the error regime by 2-5x, so a shape comparison on top of it is
    uninterpretable — exactly H34's trap.
  THE_MOVE_THAT_MATTERED: >
    When a construction bar fails, ask whether the bar can distinguish "broken"
    from "surprising". B0 could not. One extra arm that MUST be the identity
    (flip and unflip before predicting) settled it in two minutes: 0.000000%
    deviation everywhere. Void run -> H45.

h45_mirror_equivariance:
