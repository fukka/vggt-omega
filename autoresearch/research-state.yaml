  vggt_omega:
    gain: "+0.10% +- 3.26, better on 3/6; wrong-sign arm +0.72% — indistinguishable"
    b3_fails_informatively: "per-frame gain MORE negative at high roll (-5.59%) than low (-2.46%)"
  B1_IS_THE_FIRST_EXTERNAL_CHECK_IN_THIS_LINE: >
    H35 computed 1.80% for DA3-Small by integrating a SYNTHETIC roll curve
    against the MEASURED roll distribution. H39 recovers 2.37% +- 2.26 by a
    direct A/B on real frames with their real roll. Agreement within a third.
