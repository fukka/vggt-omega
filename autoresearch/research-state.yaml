  - id: H7
    statement: >
      Theta-conditioned LoRA: gating the low-rank update by incidence angle,
      dW(x) = B diag(g(theta)) A, matches or beats uniform LoRA (H5) at equal
      or smaller rank, because the measured failure field (run_009) is a
      smooth function of theta and uniform LoRA wastes capacity spending it
      isotropically.
    status: refuted   # all three predictions failed: gated==uniform at r=8 AND r=4 (0.572/0.567, 0.754/0.753); gate curve flat (|g-1|~0.06). Mechanism: PE already puts spatially-varying corrections inside uniform LoRA's hypothesis class. Kept as a paper ablation; no GPU spend.
    motivation: "Model-level novelty per human directive; input-geometry-conditioned PEFT is unclaimed in the 2026-08-19 survey; inference-free (g(theta) precomputable per token)."
    parent: H5
    priority: closed
  - id: H8
    statement: >
      Equal-solid-angle tokenization: resampling KB4 input to an equal-area
      patch grid removes the center-oversampling gradient at source and cuts
