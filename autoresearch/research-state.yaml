  mechanisms_now_ruled_out:
    - "H22: more rim pixels make a better fitting set. Refuted; it is the exact opposite."
    - "H23: rim-expanding geometries lose because their extra pixels are interpolated. Refuted."
  what_the_residual_must_be: >
    Not pixel-level detail, since doubling it does nothing. It has to be about
    WHERE the angular content sits across the image radius — same rays, same
    sharpness, different arrangement. Rhymes with the border result, where
    position mattered and area did not. NO THIRD GUESS IS OFFERED: two have
    already been refuted on this one effect.
  recommendation_unaffected: >
    The monotone ordering reproduces at both source resolutions with the same
    slope, so "fit on a rim-compressing geometry" is not an artefact of the 504
    pipeline. Incidental: at 1008 every geometry is ~1.5-2 points worse on
    seq136 — a uniform offset, the sharper input sitting further from what the
    504-derived teacher cache represents. Matters only if that cache is ever
    re-derived at higher resolution.

do_not_run_as_designed:
  probe: >
    Scaling the same lens into a smaller disc to move content inward without
    changing the radial mapping. It is exactly the probe the open mechanism
