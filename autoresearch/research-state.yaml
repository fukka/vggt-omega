    - "Aria has 2 SLAM cams with factory extrinsics: static stereo baseline at every timestamp would bypass rotation-dominant-motion failure entirely; check ADT stream availability locally"
    - "dynamic hands poison static-scene triangulation exactly in the worst cells; anchor motion-consistency gate mandatory in every H9 falsifier"
    - "rolling shutter: rim has max image-plane velocity; solvers assume global shutter; ADT has row timestamps to measure it"

