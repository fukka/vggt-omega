    priority: closed
  - id: H9
    statement: >
      Self-supervised radial-field removal (RayCal-TTA): classical bearing-space
      pose -> triangulated full-FOV range anchors -> fit and remove the backbone's
      radial compression field WITHOUT depth labels, so one affine serves the whole
      image (the F4 criterion). Framed as GT-free adaptation to an unseen camera.
      Application-step fork to settle empirically: analytic log-linear g(theta),c(theta)
      inverse (Opus) vs anchor-pseudo-labeled feature-conditioned center-zero field
      head (Fable; dodges the H2.1/F3 output-indexed ceiling).
    status: proposed   # multi-agent brainstorm consensus M1 (literature/2026-08-19-arch-brainstorm/synthesis.md). Locked bar: scale_shift<->frozen-affine gap must COLLAPSE, not just the aligned number drop. Day-1 oracle-pose arm; g(theta) must match run_009's GT field. PRE-CHECKS FIRST: two-annuli (run_006 outer arm at adequate n), Aria SLAM-cam stereo availability, hand motion-consistency gate in every falsifier.
    motivation: "Human-directed decoupling brainstorm 2026-08-19. Pose->depth arrow; converts F8 (one apartment) from liability to headline since adaptation needs video, not labels."
    parent: null
    priority: high
  - id: H10
    statement: >
      Decoupled pose stream (FrozenMatch): detector-free coarse-to-fine matching on
      FROZEN backbone features (zero extra encoder pass), exact KB4 ray lift,
      classical spherical solver, coverage-stratified RANSAC (never theta-weighting,
      per H1), full-field not rim-only (run_007: center deletion costs +5.3 deg).
